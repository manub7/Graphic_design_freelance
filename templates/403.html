<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access denied &middot; Graphic Design Freelance</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f4f6f9; color: #212529;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Lato', Arial, sans-serif;
      padding: 1.5rem;
    }
    .err-card {
      background: #fff; border-top: 4px solid #ffc107; box-shadow: 0 10px 40px rgba(0,0,0,.08);
      max-width: 520px; width: 100%; padding: 2.25rem 2rem; text-align: center;
    }
    .err-code { font-size: 3rem; font-weight: 700; color: #e0a800; margin: 0; line-height: 1; }
    h1 { font-size: 1.4rem; text-transform: uppercase; letter-spacing: .03em; margin: .75rem 0 .5rem; }
    p { color: #495057; font-size: .95rem; line-height: 1.5; margin: .5rem 0; }
    .btn {
      display: inline-block; background: #007bff; color: #fff; text-decoration: none;
      padding: .65rem 1.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
      margin: 1rem .35rem 0;
    }
    .btn:hover { opacity: .9; }
  </style>
</head>
<body>
  <div class="err-card">
    <p class="err-code">403</p>
    <h1>Access denied</h1>
    <p>You don't have permission to view this page. If you were in the middle of
       signing in, your session may have expired &mdash; try signing in again.</p>
    <a class="btn" href="/accounts/login/">Sign in</a>
    <a class="btn" href="/" style="background:#6c757d;">Back to home</a>
  </div>
</body>
</html>
